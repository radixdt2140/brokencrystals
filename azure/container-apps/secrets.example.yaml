# BrokenCrystals - Environment and Secret Reference
# Example only. Never put real credentials in this file.

secrets:
  - name: database-password
    source: Application PostgreSQL
    value: REPLACE_WITH_APPROVED_SECRET

  - name: keycloak-database-password
    source: Keycloak PostgreSQL
    value: REPLACE_WITH_APPROVED_SECRET

  - name: keycloak-admin-password
    source: Keycloak bootstrap administrator
    value: REPLACE_WITH_APPROVED_SECRET

  - name: keycloak-admin-client-secret
    source: Keycloak admin client
    value: REPLACE_WITH_APPROVED_SECRET

  - name: keycloak-client-secret
    source: Keycloak application client
    value: REPLACE_WITH_APPROVED_SECRET

  - name: jwt-secret-key
    source: Application JWT configuration
    value: REPLACE_WITH_APPROVED_SECRET

  - name: chat-api-token
    source: Chat API, if required
    value: REPLACE_WITH_APPROVED_SECRET

environment:
  NODE_ENV: production
  ENABLE_HTTPS: "false"
  ENABLE_CLUSTER: "false"
  FASTIFY_LOGGER: "true"
  FASTIFY_LOG_LEVEL: warn

  DATABASE_HOST: REPLACE_AFTER_DATABASE_DECISION
  DATABASE_PORT: "5432"
  DATABASE_SCHEMA: REPLACE_AFTER_DATABASE_DECISION
  DATABASE_USER: REPLACE_AFTER_DATABASE_DECISION
  DATABASE_PASSWORD: REFERENCE_DATABASE_PASSWORD_SECRET

  KEYCLOAK_SERVER_URI: REPLACE_AFTER_INGRESS_DECISION
  KEYCLOAK_REALM: brokencrystals
  KEYCLOAK_PUBLIC_CLIENT_ID: REPLACE_WITH_APPROVED_CLIENT_ID
  KEYCLOAK_PUBLIC_CLIENT_SECRET: REFERENCE_KEYCLOAK_CLIENT_SECRET
  KEYCLOAK_ADMIN_CLIENT_ID: REPLACE_WITH_APPROVED_ADMIN_CLIENT_ID
  KEYCLOAK_ADMIN_CLIENT_SECRET: REFERENCE_KEYCLOAK_ADMIN_CLIENT_SECRET

  JWT_SECRET_KEY: REFERENCE_JWT_SECRET_KEY
  JWT_PRIVATE_KEY_LOCATION: ./config/keys/jwtRS256.key
  JWT_PUBLIC_KEY_LOCATION: ./config/keys/jwtRS256.key.pub.pem
  JWK_PRIVATE_KEY_LOCATION: ./config/keys/jwk.key.pem
  JWK_PUBLIC_JSON: ./config/keys/jwk.pub.json

  URL: REPLACE_WITH_APPROVED_AZURE_APPLICATION_URL
  GRPC_WEB_PROXY_URL: http://localhost:8081

  CHAT_API_URL: http://localhost:11434/v1/chat/completions
  CHAT_API_MODEL: smollm:135m
  CHAT_API_MAX_TOKENS: "200"
  CHAT_API_TOKEN: ""

  # Configure these only after the MailCatcher architecture is approved.
  # SMTP host: localhost
  # SMTP port: 1025
  # MailCatcher API: http://localhost:1080/messages

pending_decisions:
  - Application and Keycloak database hosting
  - Database persistence and reset behavior
  - Keycloak ingress and hostname
  - MailCatcher and Ollama deployment
  - Credential and private-key rotation
  - Custom domain
